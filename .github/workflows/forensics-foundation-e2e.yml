name: forensics-foundation-e2e

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-sleuthkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Sleuth Kit and ext4 tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends sleuthkit e2fsprogs
          fls -V
          mkfs.ext4 -V
          debugfs -V

      - name: Compile forensic integration modules
        run: python -m compileall -q packages/integrations

      - name: Run live Sleuth Kit certification
        env:
          NEXUS_RUN_SLEUTHKIT_E2E: "1"
        run: python -m unittest packages.integrations.e2e.test_sleuthkit_e2e -v

  certify-volatility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Volatility 3
        run: |
          python -m pip install --disable-pip-version-check "volatility3==2.26.2"
          vol --help >/dev/null

      - name: Compile forensic integration modules
        run: python -m compileall -q packages/integrations

      - name: Run live Volatility certification
        env:
          NEXUS_RUN_VOLATILITY_E2E: "1"
        run: python -m unittest packages.integrations.e2e.test_volatility_e2e -v

  certify-velociraptor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download pinned Velociraptor binary
        run: |
          set -euo pipefail
          url="https://github.com/Velocidex/velociraptor/releases/download/v0.77.2/velociraptor-v0.77.2-linux-amd64"
          curl --fail --location --silent --show-error "$url" --output /tmp/velociraptor
          echo "6c4c23c466d892788ff56ddcd3a31f844e4c0d797ade454c5e2625eb9e427077  /tmp/velociraptor" | sha256sum --check --strict
          chmod 0755 /tmp/velociraptor
          /tmp/velociraptor version

      - name: Compile forensic integration modules
        run: python -m compileall -q packages/integrations

      - name: Run live Velociraptor certification
        env:
          NEXUS_RUN_VELOCIRAPTOR_E2E: "1"
          NEXUS_VELOCIRAPTOR_BIN: /tmp/velociraptor
        run: python -m unittest packages.integrations.e2e.test_velociraptor_e2e -v

  certify-timesketch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout NEXUS
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Timesketch API client
        run: python -m pip install --disable-pip-version-check "timesketch-api-client==20260611"

      - name: Checkout pinned Timesketch release
        run: git clone --depth 1 --branch 20260630 https://github.com/google/timesketch.git /tmp/timesketch

      - name: Start official Timesketch development stack
        working-directory: /tmp/timesketch/docker/dev
        run: |
          set -euo pipefail
          docker compose up -d
          for attempt in $(seq 1 90); do
            if docker compose logs timesketch 2>&1 | grep -q "Timesketch development server is ready!"; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              docker compose ps
              docker compose logs --no-color timesketch
              exit 1
            fi
            sleep 2
          done
          docker compose exec -d timesketch celery -A timesketch.lib.tasks worker --loglevel info
          docker compose exec -d timesketch gunicorn --reload -b 0.0.0.0:5000 --log-file - --timeout 120 timesketch.wsgi:application
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:5000/ >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose ps
              docker compose logs --no-color timesketch
              exit 1
            fi
            sleep 2
          done

      - name: Run authenticated Timesketch certification
        env:
          NEXUS_RUN_TIMESKETCH_E2E: "1"
          NEXUS_TIMESKETCH_URL: http://127.0.0.1:5000
          NEXUS_TIMESKETCH_USER: dev
          NEXUS_TIMESKETCH_PASSWORD: dev
        run: python -m unittest packages.integrations.e2e.test_timesketch_e2e -v

      - name: Capture Timesketch logs on failure
        if: failure()
        working-directory: /tmp/timesketch/docker/dev
        run: docker compose logs --no-color || true

      - name: Stop Timesketch stack
        if: always()
        working-directory: /tmp/timesketch/docker/dev
        run: docker compose down --volumes --remove-orphans || true
