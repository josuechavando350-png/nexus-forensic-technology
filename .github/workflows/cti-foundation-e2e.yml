name: cti-foundation-e2e

on:
  pull_request:
    paths:
      - "infra/cti/**"
      - "packages/integrations/cti.py"
      - "packages/integrations/e2e/test_cti_foundation_e2e.py"
      - ".github/workflows/cti-foundation-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "infra/cti/**"
      - "packages/integrations/cti.py"
      - "packages/integrations/e2e/test_cti_foundation_e2e.py"
      - ".github/workflows/cti-foundation-e2e.yml"

permissions:
  contents: read

jobs:
  certify-opencti:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check "requests==2.32.5"
      - name: Start OpenCTI stack
        run: docker compose -f infra/cti/opencti-compose.yml up -d
      - name: Show OpenCTI container state
        run: docker compose -f infra/cti/opencti-compose.yml ps
      - name: Run live OpenCTI certification
        env:
          NEXUS_RUN_OPENCTI_E2E: "1"
        run: python -m unittest packages.integrations.e2e.test_cti_foundation_e2e.OpenCTIE2ETests -v
      - name: Capture OpenCTI logs on failure
        if: failure()
        run: docker compose -f infra/cti/opencti-compose.yml logs --no-color
      - name: Stop OpenCTI stack
        if: always()
        run: docker compose -f infra/cti/opencti-compose.yml down -v --remove-orphans

  certify-misp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MISP client
        run: python -m pip install --disable-pip-version-check "requests==2.32.5" "pymisp==2.5.17.2"
      - name: Start MISP stack
        run: docker compose -f infra/cti/misp-compose.yml up -d
      - name: Show MISP container state
        run: docker compose -f infra/cti/misp-compose.yml ps
      - name: Run live MISP certification
        env:
          NEXUS_RUN_MISP_E2E: "1"
        run: python -m unittest packages.integrations.e2e.test_cti_foundation_e2e.MISPE2ETests -v
      - name: Capture MISP logs on failure
        if: failure()
        run: docker compose -f infra/cti/misp-compose.yml logs --no-color
      - name: Stop MISP stack
        if: always()
        run: docker compose -f infra/cti/misp-compose.yml down -v --remove-orphans
