name: security-foundation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-security-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-security.txt

      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements-security.txt

      - name: Compile security foundation
        run: python -m compileall -q packages/security_foundation

      - name: Strict type check
        run: mypy --strict --ignore-missing-imports packages/security_foundation

      - name: Run security foundation tests
        run: python -m unittest packages.security_foundation.tests.test_security_foundation -v
