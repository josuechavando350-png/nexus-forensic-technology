name: api-foundation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-api-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: N3xusSecurePass2026!
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: 96f8c6d4e8b2a1c7d3e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7
      LOG_FILE_PATH: /tmp/nexus_api_foundation_ci_audit.log
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install pinned API dependencies
        run: python -m pip install --requirement requirements-api.txt

      - name: Compile API sources
        run: python -m compileall -q config.py auth.py auditoria.py tasks.py main.py tests

      - name: Strict type check
        run: >-
          mypy --strict --ignore-missing-imports
          --disable-error-code=untyped-decorator
          config.py auth.py auditoria.py tasks.py main.py

      - name: Run API foundation tests
        run: python -m unittest tests.test_api_foundation -v
