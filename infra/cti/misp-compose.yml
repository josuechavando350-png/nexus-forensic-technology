services:
  redis:
    image: valkey/valkey:7.2.11
    command: ["valkey-server", "--requirepass", "redispassword", "--save", ""]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a redispassword ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30

  db:
    image: mariadb:10.11.13
    environment:
      MYSQL_USER: misp
      MYSQL_PASSWORD: example
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: misp
    command: ["--innodb-buffer-pool-size=512M", "--innodb-change-buffering=none"]
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin --user=misp --password=example status"]
      interval: 5s
      timeout: 3s
      retries: 40

  misp-core:
    image: ghcr.io/misp/misp-docker/misp-core:v2.5.44
    cap_add:
      - AUDIT_WRITE
    environment:
      BASE_URL: "http://localhost"
      ADMIN_EMAIL: "admin@nexus.test"
      ADMIN_PASSWORD: "Nexus-MISP-Certification-2026!"
      ADMIN_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      ADMIN_ORG: "NEXUS-CERT"
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: misp
      MYSQL_PASSWORD: example
      MYSQL_DATABASE: misp
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: redispassword
      DISABLE_SSL_REDIRECT: "true"
      AUTOCONF_GPG: "false"
      DISABLE_CA_REFRESH: "true"
      MISP_MODULES_FQDN: ""
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/users/heartbeat >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
