name: data-foundation-e2e

on:
  pull_request:
    paths:
      - "infra/data-foundation/**"
      - "packages/integrations/**"
      - ".github/workflows/data-foundation-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "infra/data-foundation/**"
      - "packages/integrations/**"
      - ".github/workflows/data-foundation-e2e.yml"

permissions:
  contents: read

jobs:
  certify-data-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install integration clients
        run: python -m pip install --disable-pip-version-check "psycopg[binary]==3.2.1" "neo4j==5.24.0" "opensearch-py==2.7.1"

      - name: Start real data services
        run: docker compose -f infra/data-foundation/docker-compose.yml up -d

      - name: Show container state
        run: docker compose -f infra/data-foundation/docker-compose.yml ps

      - name: Run end-to-end certification
        run: python -m unittest packages.integrations.tests.test_data_foundation_e2e -v

      - name: Capture service logs on failure
        if: failure()
        run: docker compose -f infra/data-foundation/docker-compose.yml logs --no-color

      - name: Stop data services
        if: always()
        run: docker compose -f infra/data-foundation/docker-compose.yml down -v --remove-orphans
